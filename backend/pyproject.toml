[project]
name = "sick-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "imlargo", email = "jlargob@unal.edu.co" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.5",
    "fastapi[standard]>=0.140.0",
    "httpx>=0.28.1",
    "pint>=0.25.3",
    "pydantic-ai-slim[anthropic,openai]>=2.18.0",
    "pydantic-settings>=2.14.2",
    "rapidfuzz>=3.14.5",
    "sse-starlette>=3.4.6",
]

[project.scripts]
sick-agent = "sick_agent:main"
cli = "sick_agent.cli:run"
build-layer = "sick_agent.knowledge.build:run"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]
