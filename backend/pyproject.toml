[project]
name = "agentsprint-starter"
version = "0.1.0"
description = "Neutral evidence-grounded AgentSprint starter"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "langchain>=1.0,<2",
  "langchain-deepseek>=1.0,<2",
  "langchain-anthropic>=1.0,<2",
  "langgraph>=1.0,<2",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "streamlit>=1.48,<2",
  "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pyyaml>=6.0,<7",
  "pytest>=8.4,<10",
  "ruff>=0.12,<1",
]

[project.scripts]
agentsprint-api = "agentsprint_starter.service.http:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentsprint_starter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["documents"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
